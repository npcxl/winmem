name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ZIP_NAME: winmem-x86_64-pc-windows-msvc.zip

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 检查（fmt / clippy / test）
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  package:
    name: 打包（Windows x64）
    runs-on: windows-latest
    needs: test
    permissions:
      # 打 tag 时需要创建 Release
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build (release)
        run: cargo build --release --locked

      - name: 组装发布包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/winmem.exe, target/release/winmem-gui.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath $env:ZIP_NAME -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: 校验产物
        shell: pwsh
        run: |
          foreach ($f in @("winmem.exe", "winmem-gui.exe")) {
            $p = Join-Path "dist" $f
            if (-not (Test-Path $p)) { throw "缺少产物：$f" }
            if ((Get-Item $p).Length -eq 0) { throw "产物为空：$f" }
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: winmem-x86_64-pc-windows-msvc
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP_NAME" `
            --title "${{ github.ref_name }}" `
            --generate-notes
