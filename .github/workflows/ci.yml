name: CI

# 持续集成：只做格式 / 静态检查 / 测试 / 发布前构建校验，**不发布**。
# 发布流程见 .github/workflows/release.yml（打 tag 触发）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查（fmt / clippy / test / release 构建）
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 静态检查
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --all-targets --locked

      # 与发布完全一致的构建配置，避免「CI 过了但发布失败」
      - name: 发布构建
        run: cargo build --release --locked

      - name: 校验可执行文件与内嵌 manifest
        shell: pwsh
        run: |
          foreach ($f in @("winmem.exe", "winmem-gui.exe")) {
            $p = "target/release/$f"
            if (-not (Test-Path $p)) { throw "缺少产物：$f" }
            if ((Get-Item $p).Length -eq 0) { throw "产物为空：$f" }
          }
          # Common Controls v6 依赖必须真的写进了 manifest
          $bin = [System.IO.File]::ReadAllText("target/release/winmem-gui.exe")
          if ($bin -notmatch "Microsoft.Windows.Common-Controls") {
            throw "winmem-gui.exe 未嵌入 Common Controls v6 manifest"
          }

      # 自检只在日志里留一份实测开销；无桌面会话时允许失败，不影响 CI 结果
      - name: 自检开销（可失败，仅记录）
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: .\target\release\winmem-gui.exe --bench 10

      - name: 上传自检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winmem-bench-report
          path: winmem-bench.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: 上传未发布构建（便于直接试用）
        uses: actions/upload-artifact@v4
        with:
          name: winmem-x86_64-pc-windows-msvc-dev
          path: |
            target/release/winmem.exe
            target/release/winmem-gui.exe
          if-no-files-found: error
          retention-days: 14
